    <script>
      (function() {
        if (typeof window === 'undefined') return;

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && event.reason.message && (
            event.reason.message.indexOf('WebSocket') !== -1 ||
            event.reason.message.indexOf('vite') !== -1
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (event.message && (
            event.message.indexOf('WebSocket') !== -1 ||
            event.message.indexOf('vite') !== -1
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        var OrigWS = window.WebSocket;
        if (OrigWS) {
          function SafeWS(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite-hmr') !== -1));
            if (isViteHmr) {
              this.url = url;
              this.protocol = 'vite-hmr';
              this.readyState = 1;
              this.OPEN = 1;
              this.CONNECTING = 0;
              this.CLOSING = 2;
              this.CLOSED = 3;
              this.listeners = {};
              var self = this;
              setTimeout(function() {
                var cbs = (self.listeners && self.listeners['open']) || [];
                cbs.forEach(function(cb) { try { cb({ type: 'open' }); } catch (e) {} });
              }, 0);
              return;
            }
            return new OrigWS(url, protocols);
          }
          SafeWS.prototype.addEventListener = function(type, cb) {
            if (!this.listeners) this.listeners = {};
            if (!this.listeners[type]) this.listeners[type] = [];
            this.listeners[type].push(cb);
            if (type === 'open' && this.readyState === 1) {
              setTimeout(function() { try { cb({ type: 'open' }); } catch (e) {} }, 0);
            }
          };
          SafeWS.prototype.removeEventListener = function(type, cb) {
            if (this.listeners && this.listeners[type]) {
              this.listeners[type] = this.listeners[type].filter(function(fn) { return fn !== cb; });
            }
          };
          SafeWS.prototype.send = function() {};
          SafeWS.prototype.close = function() {
            this.readyState = 3;
            var cbs = (this.listeners && this.listeners['close']) || [];
            cbs.forEach(function(cb) { try { cb({ type: 'close', wasClean: true }); } catch (e) {} });
          };
          SafeWS.CONNECTING = 0;
          SafeWS.OPEN = 1;
          SafeWS.CLOSING = 2;
          SafeWS.CLOSED = 3;
          window.WebSocket = SafeWS;
        }
      })();
    </script>
